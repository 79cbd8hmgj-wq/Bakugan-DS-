name: Apply Milestone 6C CRC remediation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-m6c-crc-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'milestone-6c-comeback-gate-implementation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Authenticate and apply CRC remediation
        shell: bash
        run: |
          set -euo pipefail
          cat .sync/crc/part-* > /tmp/m6c-crc.patch.xz.b64
          test "$(wc -c < /tmp/m6c-crc.patch.xz.b64)" = "9184"
          base64 --decode /tmp/m6c-crc.patch.xz.b64 > /tmp/m6c-crc.patch.xz
          test "$(sha256sum /tmp/m6c-crc.patch.xz | awk '{print $1}')" = "cc9249d9e498d6bb701622ceec4cd916c7a6f3124344224058190397866179b1"
          xz -t /tmp/m6c-crc.patch.xz
          xz -dc /tmp/m6c-crc.patch.xz > /tmp/m6c-crc.patch
          test "$(sha256sum /tmp/m6c-crc.patch | awk '{print $1}')" = "25984623333a8206bee7fe50297c3a8236f00dcfbf7dc42e4977a41f0599557f"
          git apply --check /tmp/m6c-crc.patch
          git apply /tmp/m6c-crc.patch
          rm -rf .sync/crc .github/workflows/apply-m6c-crc-remediation.yml

      - name: Verify remediated source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          mapfile -t changed_python < <(git diff --name-only --diff-filter=ACMRT HEAD -- '*.py')
          if ((${#changed_python[@]})); then
            python -m ruff check --fix --unsafe-fixes "${changed_python[@]}"
            python -m ruff format "${changed_python[@]}"
            python -m ruff check "${changed_python[@]}"
          fi
          mapfile -t changed_source < <(printf '%s\n' "${changed_python[@]}" | grep '^src/bakugan_ds/.*\.py$' || true)
          if ((${#changed_source[@]})); then
            python -m mypy "${changed_source[@]}"
          fi
          python -m compileall -q src tests tools
          python -m pytest -q
          git diff --check

      - name: Commit CRC remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: validate complete Gate payload CRC at runtime"
          git push origin HEAD:${{ github.head_ref }}
