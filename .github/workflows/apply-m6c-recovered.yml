name: Apply recovered Milestone 6C patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-m6c-recovered-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'milestone-6c-comeback-gate-implementation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and apply recovered source patch
        shell: bash
        run: |
          set -euo pipefail
          sha256sum .sync/m6c-final.patch.xz
          xz -t .sync/m6c-final.patch.xz
          xz -dc .sync/m6c-final.patch.xz > /tmp/m6c-final.patch
          test "$(sha256sum /tmp/m6c-final.patch | awk '{print $1}')" = "896cce6866ef537148eadf8d85cc0131f9d815de09e0c7d63e42edfbc3b56b94"
          git apply --check /tmp/m6c-final.patch
          git apply /tmp/m6c-final.patch
          rm -rf .sync .github/workflows/apply-m6c-recovered.yml

      - name: Verify synchronized source tree
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m compileall -q src tests tools
          mapfile -t changed_python < <(git diff --name-only --diff-filter=ACMRT HEAD -- '*.py')
          if ((${#changed_python[@]})); then
            python -m ruff check "${changed_python[@]}"
          fi
          mapfile -t changed_source < <(printf '%s\n' "${changed_python[@]}" | grep '^src/bakugan_ds/.*\.py$' || true)
          if ((${#changed_source[@]})); then
            python -m mypy "${changed_source[@]}"
          fi
          python -m pytest -q
          git diff --check

      - name: Commit synchronized implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: implement Milestone 6C Comeback Gate"
          git push origin HEAD:${{ github.head_ref }}
