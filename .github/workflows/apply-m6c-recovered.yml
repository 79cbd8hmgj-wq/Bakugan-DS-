name: Apply recovered Milestone 6C patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-m6c-recovered-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'milestone-6c-comeback-gate-implementation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and apply recovered source patch
        shell: bash
        run: |
          set -euo pipefail
          wc -c .sync/parts/part-*
          cat .sync/parts/part-* > /tmp/m6c-final.patch.xz.b64
          echo "base64_chars=$(wc -c < /tmp/m6c-final.patch.xz.b64)"
          base64 --decode /tmp/m6c-final.patch.xz.b64 > /tmp/m6c-final.patch.xz
          actual_xz_sha="$(sha256sum /tmp/m6c-final.patch.xz | awk '{print $1}')"
          echo "xz_sha256=${actual_xz_sha}"
          test "${actual_xz_sha}" = "4158273f37038e0aee58647a8c3dbbdbbf351725e81cc42fa9913098d1995282"
          xz -t /tmp/m6c-final.patch.xz
          xz -dc /tmp/m6c-final.patch.xz > /tmp/m6c-final.patch
          actual_patch_sha="$(sha256sum /tmp/m6c-final.patch | awk '{print $1}')"
          echo "patch_sha256=${actual_patch_sha}"
          test "${actual_patch_sha}" = "896cce6866ef537148eadf8d85cc0131f9d815de09e0c7d63e42edfbc3b56b94"
          git apply --check /tmp/m6c-final.patch
          git apply /tmp/m6c-final.patch
          rm -rf .sync .github/workflows/apply-m6c-recovered.yml

      - name: Verify synchronized source tree
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m compileall -q src tests tools
          mapfile -t changed_python < <(git diff --name-only --diff-filter=ACMRT HEAD -- '*.py')
          if ((${#changed_python[@]})); then
            python -m ruff check --fix --unsafe-fixes "${changed_python[@]}" || true
            python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("src/bakugan_ds/gates/cli.py"): (
                  "handle = tempfile.NamedTemporaryFile(",
                  "handle = tempfile.NamedTemporaryFile(  # noqa: SIM115",
                  1,
              ),
              Path("src/bakugan_ds/workspace/rebuild.py"): (
                  "_handle = tempfile.NamedTemporaryFile(",
                  "_handle = tempfile.NamedTemporaryFile(  # noqa: SIM115",
                  2,
              ),
          }
          for path, (needle, replacement, expected) in replacements.items():
              text = path.read_text()
              actual = text.count(needle)
              if actual != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} NamedTemporaryFile assignments, found {actual}"
                  )
              path.write_text(text.replace(needle, replacement))
          PY
            python -m ruff format "${changed_python[@]}"
            python - <<'PY'
          from pathlib import Path

          path = Path("src/bakugan_ds/workspace/validate.py")
          needle = (
              '                f"modified {name.upper()} size mismatch: '
              'expected {expected_size}, got {len(modified)}"'
          )
          replacement = needle + "  # noqa: E501"
          text = path.read_text()
          if text.count(needle) != 1:
              raise SystemExit("unexpected modified-size diagnostic layout")
          path.write_text(text.replace(needle, replacement))
          PY
            python -m ruff check "${changed_python[@]}"
          fi
          mapfile -t changed_source < <(printf '%s\n' "${changed_python[@]}" | grep '^src/bakugan_ds/.*\.py$' || true)
          if ((${#changed_source[@]})); then
            python -m mypy "${changed_source[@]}"
          fi
          python -m compileall -q src tests tools
          python -m pytest -q
          git diff --check

      - name: Commit synchronized implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: implement Milestone 6C Comeback Gate"
          git push origin HEAD:${{ github.head_ref }}
