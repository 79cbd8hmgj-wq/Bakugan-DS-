name: Apply Task 8 Evidence

on:
  push:
    branches:
      - milestone-6b-task-8-difficulty-context

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Apply verified Task 8 files
        env:
          TASK8_ARCHIVE_BASE64: 
        run: |
          set -euo pipefail
          printf '%s' "$TASK8_ARCHIVE_BASE64" | base64 --decode > "$RUNNER_TEMP/task8-changes.tar.gz"
          tar -xzf "$RUNNER_TEMP/task8-changes.tar.gz" -C "$GITHUB_WORKSPACE"
          rm -f .github/workflows/export-task8-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: confirm battle difficulty context"
          git push origin HEAD:milestone-6b-task-8-difficulty-context
