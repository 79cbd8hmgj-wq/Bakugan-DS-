name: Finalize Task 8 Status

on:
  push:
    branches:
      - milestone-6b-task-8-difficulty-context

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Apply status and remove helper
        env:
          STATUS_BASE64: 
        run: |
          set -euo pipefail
          printf '%s' "$STATUS_BASE64" | base64 --decode > docs/superpowers/plans/2026-08-02-milestone-6b-task-status.md
          rm -f .github/workflows/finalize-task8-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: complete Task 8 difficulty status"
          git push origin HEAD:milestone-6b-task-8-difficulty-context
