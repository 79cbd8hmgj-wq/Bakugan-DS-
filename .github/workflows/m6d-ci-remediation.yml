name: Apply Milestone 6D CI remediation

on:
  push:
    branches:
      - milestone-6d-core-balance-framework
    paths:
      - .github/workflows/m6d-ci-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install development tools
        run: python -m pip install -e '.[dev]'
      - name: Apply exact Ruff fixes
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check --fix src/bakugan_ds/gates/runtime_module_6d.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_gate_milestone_6d_artifacts.py')
          text = path.read_text()
          text = text.replace('0x0228BC20–0x02293C20', '0x0228BC20\\u20130x02293C20')
          text = text.replace('0x02293C20–0x02293C60', '0x02293C20\\u20130x02293C60')
          path.write_text(text)
          PY
          python -m ruff check \
            src/bakugan_ds/gates/runtime_module_6d.py \
            tests/test_gate_milestone_6d_artifacts.py
          rm -f .github/workflows/m6d-ci-remediation.yml
          git diff --check
      - name: Commit remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: satisfy Milestone 6D Ruff checks"
          git push origin HEAD:milestone-6d-core-balance-framework
