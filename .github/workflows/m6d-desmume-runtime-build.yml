name: Apply Milestone 6D Final Sync

on:
  push:
    branches:
      - milestone-6d-core-balance-framework
    paths:
      - .github/workflows/m6d-desmume-runtime-build.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: milestone-6d-core-balance-framework
          fetch-depth: 0

      - name: Verify and apply final source patch
        run: |
          set -euo pipefail
          cat automation/m6d-final-sync/chunk-* > /tmp/m6d-final-sync.patch.gz.b64
          echo "52a299063d300aad0c0a736cd07a52747a2736b89a21f77e54cdfcb387e3f038  /tmp/m6d-final-sync.patch.gz.b64" | sha256sum -c -
          base64 --decode /tmp/m6d-final-sync.patch.gz.b64 > /tmp/m6d-final-sync.patch.gz
          echo "d9448cf4130017c013ab3efd37a509fccdf8588cafdb55ff3a2b5474b09aa962  /tmp/m6d-final-sync.patch.gz" | sha256sum -c -
          gzip --decompress --stdout /tmp/m6d-final-sync.patch.gz > /tmp/m6d-final-sync.patch
          echo "2f004c64d2589ced74b0cbc7fa5d4e078e621401d0ec9c8d039b491df2840049  /tmp/m6d-final-sync.patch" | sha256sum -c -
          git apply --check /tmp/m6d-final-sync.patch
          git apply --index /tmp/m6d-final-sync.patch

      - name: Remove temporary synchronization files
        run: |
          set -euo pipefail
          git rm -r automation/m6d-final-sync
          git rm .github/workflows/m6d-desmume-runtime-build.yml

      - name: Commit and push synchronized source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: complete Milestone 6D balance framework"
          git push origin HEAD:milestone-6d-core-balance-framework
