name: Apply Milestone 6D Runtime Batch

on:
  push:
    branches:
      - milestone-6d-core-balance-framework
    paths:
      - automation/m6d-runtime-sync.patch.gz.b64
      - .github/workflows/m6d-runtime-sync.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: milestone-6d-core-balance-framework
          fetch-depth: 0
      - name: Apply exact locally verified runtime batch
        run: |
          if [[ ! -f automation/m6d-runtime-sync.patch.gz.b64 ]]; then
            echo "No staged runtime batch remains."
            exit 0
          fi
          base64 --decode automation/m6d-runtime-sync.patch.gz.b64 \
            | gzip --decompress > "$RUNNER_TEMP/m6d-runtime-sync.patch"
          git apply -p1 --check "$RUNNER_TEMP/m6d-runtime-sync.patch"
          git apply -p1 "$RUNNER_TEMP/m6d-runtime-sync.patch"
          rm automation/m6d-runtime-sync.patch.gz.b64
          rm .github/workflows/m6d-runtime-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate generic Gate runtime dispatch"
          git push origin HEAD:milestone-6d-core-balance-framework
