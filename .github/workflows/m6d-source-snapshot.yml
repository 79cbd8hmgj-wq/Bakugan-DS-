name: Milestone 6D Source Snapshot

on:
  push:
    branches:
      - milestone-6d-core-balance-framework
  pull_request:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pack exact source checkout
        run: tar --exclude=.git -czf "$RUNNER_TEMP/milestone-6d-source.tar.gz" .
      - name: Upload exact source checkout
        uses: actions/upload-artifact@v4
        with:
          name: milestone-6d-source
          path: ${{ runner.temp }}/milestone-6d-source.tar.gz
          retention-days: 1
          if-no-files-found: error
