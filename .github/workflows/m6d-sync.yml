name: Apply Milestone 6D Verified Patch

on:
  push:
    branches:
      - milestone-6d-core-balance-framework
    paths:
      - automation/m6d-sync.patch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: milestone-6d-core-balance-framework
          fetch-depth: 0
      - name: Apply exact locally verified patch
        run: |
          test -f automation/m6d-sync.patch
          git apply automation/m6d-sync.patch
          cp config/gates/milestone-6c-system2-v1.json \
            config/gates/milestone-6d-system2-v1.json
          rm automation/m6d-sync.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Milestone 6D authoring and reporting"
          git push origin HEAD:milestone-6d-core-balance-framework
