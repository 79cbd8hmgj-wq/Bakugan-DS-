name: M6E Runtime Source Export

on:
  push:
    branches:
      - milestone-6e-complete-gate-roster-conversion

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Package source snapshot
        run: |
          tar --exclude=.git -czf /tmp/m6e-source.tar.gz .
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: m6e-source-snapshot
          path: /tmp/m6e-source.tar.gz
          if-no-files-found: error
          retention-days: 1
