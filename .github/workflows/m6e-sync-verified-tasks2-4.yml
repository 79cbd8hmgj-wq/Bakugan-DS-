name: Sync Verified Milestone 6E Tasks 2-4

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/m6e-sync-verified-tasks2-4.yml
      - automation/m6e-sync/**

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.ref == 'milestone-6e-complete-gate-roster-conversion'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: milestone-6e-complete-gate-roster-conversion
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project tooling
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Reassemble and verify exact patch
        run: |
          set -euo pipefail
          wc -c automation/m6e-sync/chunk-*
          sha256sum automation/m6e-sync/chunk-*
          printf '%s  %s\n' \
            '78e93bebd1ad98eec8663aaa97a0ebbede0d6de2ef534b21d5e9097947b1d7d0' \
            automation/m6e-sync/chunk-000 | sha256sum -c -
          printf '%s  %s\n' \
            '6154882d883a95a80bc67f658cc9e2b1a1930456195e34dbbad3f467970bc035' \
            automation/m6e-sync/chunk-001 | sha256sum -c -
          printf '%s  %s\n' \
            '106b672c5055464d8561e573372d59f036e7053f3699cf838680af36558bc027' \
            automation/m6e-sync/chunk-002 | sha256sum -c -
          printf '%s  %s\n' \
            '7a70454c7cebeb5ca01ee387dbcaf4c1ca5b5c5efed793fb64d9b71cc2951294' \
            automation/m6e-sync/chunk-003 | sha256sum -c -
          cat automation/m6e-sync/chunk-* > /tmp/m6e-tasks2-4.patch.gz.b64
          base64 --decode /tmp/m6e-tasks2-4.patch.gz.b64 \
            > /tmp/m6e-tasks2-4.patch.gz
          printf '%s  %s\n' \
            'fe031a7a4824b91089a479c0c07163f4ef03ce1ab6b62d1928e3a0ebf7e34cf4' \
            /tmp/m6e-tasks2-4.patch.gz | sha256sum -c -
          gzip --test /tmp/m6e-tasks2-4.patch.gz
          gzip --decompress --stdout /tmp/m6e-tasks2-4.patch.gz \
            > /tmp/m6e-tasks2-4.patch
          printf '%s  %s\n' \
            '23998ce7dd4f42c453922ccb855ff49aa2e059b40126d89744411165adfe62be' \
            /tmp/m6e-tasks2-4.patch | sha256sum -c -
          git apply --check /tmp/m6e-tasks2-4.patch
          git apply /tmp/m6e-tasks2-4.patch

      - name: Verify Tasks 1-4 and repository regression suite
        run: |
          set -euo pipefail
          python -m pytest -q
          python -m ruff check src tests tools
          python -m mypy src
          python -m compileall -q src tests tools
          git diff --check

      - name: Commit verified source and remove synchronization files
        run: |
          set -euo pipefail
          rm -rf automation/m6e-sync
          rm -f .github/workflows/m6e-sync-verified-tasks2-4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: complete Milestone 6E Tasks 2-4'
          git push origin HEAD:milestone-6e-complete-gate-roster-conversion

# sync trigger: diagnose exact chunk hashes
