name: Milestone 6E Task 10 contracts

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: milestone-6e-task10-contracts-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contracts:
    if: >-
      github.head_ref == 'milestone-6e-complete-gate-roster-conversion' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Generate and verify final contracts
        shell: bash
        run: |
          set +e
          : > /tmp/task10.log
          status=0

          run_checked() {
            if [[ $status -eq 0 ]]; then
              "$@" >> /tmp/task10.log 2>&1
              status=$?
            fi
          }

          run_checked python .github/scripts/m6e_task10_contracts.py
          run_checked python -m pytest -q \
            tests/unit/test_gate_roster_contracts.py \
            tests/unit/test_gate_milestone_6e_risk_chaos.py \
            tests/unit/test_gate_roster_metadata.py \
            tests/unit/test_gate_roster_analysis.py
          run_checked python -m compileall -q src tests tools
          run_checked python -m ruff check \
            .github/scripts/m6e_task10_contracts.py \
            src/bakugan_ds/gates/roster_contracts.py \
            tests/unit/test_gate_roster_contracts.py
          run_checked python -m mypy src/bakugan_ds
          run_checked python -m pytest -q
          run_checked git diff --check

          cat /tmp/task10.log
          if [[ $status -ne 0 ]]; then
            exit $status
          fi
      - name: Commit verified Task 10 contracts
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/m6e-task10-contracts.yml \
            .github/scripts/m6e_task10_contracts.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            analysis/gates/milestone-6e-roster-contract.json \
            analysis/gates/milestone-6e-balance-contract.json \
            config/gates/milestone-6e-roster-metadata.json \
            src/bakugan_ds/gates/roster_contracts.py \
            tests/unit/test_gate_roster_contracts.py
          git commit -m 'feat: freeze final Gate roster contracts'
          git push origin HEAD:${{ github.head_ref }}
