name: Milestone 6E Task 10 export

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: milestone-6e-task10-export-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  export:
    if: >-
      github.head_ref == 'milestone-6e-complete-gate-roster-conversion' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Regenerate and verify Task 10
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/m6e_task10_contracts.py
          python -m pytest -q \
            tests/unit/test_gate_roster_contracts.py \
            tests/unit/test_gate_milestone_6e_risk_chaos.py \
            tests/unit/test_gate_roster_metadata.py \
            tests/unit/test_gate_roster_analysis.py
          python -m compileall -q src tests tools
          python -m ruff check \
            .github/scripts/m6e_task10_contracts.py \
            src/bakugan_ds/gates/roster_contracts.py \
            tests/unit/test_gate_roster_contracts.py \
            tests/unit/test_gate_milestone_6e_power_attribute.py \
            tests/unit/test_gate_milestone_6e_skill_control.py \
            tests/unit/test_gate_milestone_6e_comeback.py \
            tests/unit/test_gate_milestone_6e_risk_chaos.py \
            tests/unit/test_gate_roster_metadata.py
          python -m mypy src/bakugan_ds
          python -m pytest -q
          git diff --check
      - name: Stage verified files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/task10-export
          while IFS= read -r path; do
            mkdir -p "/tmp/task10-export/$(dirname "$path")"
            cp "$path" "/tmp/task10-export/$path"
          done <<'PATHS'
          analysis/gates/milestone-6e-roster-contract.json
          analysis/gates/milestone-6e-balance-contract.json
          config/gates/milestone-6e-system2-v1.json
          config/gates/milestone-6e-roster-metadata.json
          tests/unit/test_gate_milestone_6e_power_attribute.py
          tests/unit/test_gate_milestone_6e_skill_control.py
          tests/unit/test_gate_milestone_6e_comeback.py
          tests/unit/test_gate_milestone_6e_risk_chaos.py
          tests/unit/test_gate_roster_metadata.py
          PATHS
      - uses: actions/upload-artifact@v4
        with:
          name: milestone-6e-task10-verified-files
          path: /tmp/task10-export
          if-no-files-found: error
          retention-days: 1
