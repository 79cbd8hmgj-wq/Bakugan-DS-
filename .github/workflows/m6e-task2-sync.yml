name: Apply Milestone 6E Tasks 2-4 Sync

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/m6e-task2-sync.yml
      - automation/m6e-task2-sync.patch.gz.b64

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.ref == 'milestone-6e-complete-gate-roster-conversion'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: milestone-6e-complete-gate-roster-conversion
          fetch-depth: 0

      - name: Verify and apply exact Tasks 2-4 patch
        run: |
          set -euo pipefail
          payload=automation/m6e-task2-sync.patch.gz.b64
          test -f "$payload"
          printf '%s  %s\n' \
            '036fc2e87e786a2a18b85849c1a3bde9a43dee1bad419ac0199da4677e11d3bd' \
            "$payload" | sha256sum -c -
          base64 --decode "$payload" > /tmp/m6e-tasks2-4.patch.gz
          printf '%s  %s\n' \
            '974f4ac54b774d7332add9da6aa999568f9c753efc44c33194e7e189063de60a' \
            /tmp/m6e-tasks2-4.patch.gz | sha256sum -c -
          gzip --decompress --stdout /tmp/m6e-tasks2-4.patch.gz > /tmp/m6e-tasks2-4.patch
          printf '%s  %s\n' \
            '9052124a4fad432ffc5f99888828922ad822a4d3e97bbfe3929c05e1b7f2f03f' \
            /tmp/m6e-tasks2-4.patch | sha256sum -c -
          git apply --check /tmp/m6e-tasks2-4.patch
          git apply /tmp/m6e-tasks2-4.patch

      - name: Verify focused Tasks 1-4 tests
        run: |
          set -euo pipefail
          export PYTHONPATH=src
          python -m pytest -q \
            tests/test_gate_milestone_6e_entry_contract.py \
            tests/test_gate_milestone_6e_id_name_map.py \
            tests/unit/test_gate_roster_metadata.py \
            tests/unit/test_gate_roster_identity.py \
            tests/unit/test_gate_roster_analysis.py \
            tests/unit/test_gate_cli.py
          python -m compileall -q src tests
          git diff --check

      - name: Commit source and remove recovery files
        run: |
          set -euo pipefail
          rm -f automation/m6e-task2-sync.patch.gz.b64
          rm -f .github/workflows/m6e-task2-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: complete Milestone 6E Tasks 2-4'
          git push origin HEAD:milestone-6e-complete-gate-roster-conversion
