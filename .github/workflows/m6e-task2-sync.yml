name: Apply Milestone 6E Task 2 Sync

on:
  push:
    branches:
      - milestone-6e-complete-gate-roster-conversion
    paths:
      - .github/workflows/m6e-task2-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: milestone-6e-complete-gate-roster-conversion
          fetch-depth: 0

      - name: Verify and apply exact Task 2 patch
        run: |
          set -euo pipefail
          payload=automation/m6e-task2-sync.patch.gz.b64
          test -f "$payload"
          printf '%s  %s\n' \
            'e76d81783b3eec02f89c2d212ab50b335414e80bc0c456e48b0e0ff77297e198' \
            "$payload" | sha256sum -c -
          base64 --decode "$payload" > /tmp/m6e-task2.patch.gz
          printf '%s  %s\n' \
            '086389a367fbe4d42662e815669b79483414f062b371fe70074c7d12d64ee8e7' \
            /tmp/m6e-task2.patch.gz | sha256sum -c -
          gzip --decompress --stdout /tmp/m6e-task2.patch.gz > /tmp/m6e-task2.patch
          printf '%s  %s\n' \
            '34729ada28a7a562003431c42b56e0406abba45b250e65e878f14fa4d26a9551' \
            /tmp/m6e-task2.patch | sha256sum -c -
          git apply --check /tmp/m6e-task2.patch
          git apply /tmp/m6e-task2.patch

      - name: Verify focused Task 1 and Task 2 tests
        run: |
          set -euo pipefail
          export PYTHONPATH=src
          python -m pytest -q \
            tests/test_gate_milestone_6e_entry_contract.py \
            tests/unit/test_gate_roster_metadata.py
          python -m compileall -q src tests
          git diff --check

      - name: Commit source and remove recovery files
        run: |
          set -euo pipefail
          rm -f automation/m6e-task2-sync.patch.gz.b64
          rm -f .github/workflows/m6e-task2-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add Milestone 6E roster metadata model'
          git push origin HEAD:milestone-6e-complete-gate-roster-conversion
