name: Diagnose Milestone 6E Recovery Payloads

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/m6e-task2-sync.yml
      - automation/m6e-task2-sync.patch.gz.b64
      - automation/m6e-tasks2-3.patch.gz.b64

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'milestone-6e-complete-gate-roster-conversion'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: milestone-6e-complete-gate-roster-conversion
          fetch-depth: 0

      - name: Diagnose preserved payloads without applying them
        run: |
          set -u
          for payload in \
            automation/m6e-task2-sync.patch.gz.b64 \
            automation/m6e-tasks2-3.patch.gz.b64
          do
            echo "=== $payload ==="
            if [[ ! -f "$payload" ]]; then
              echo 'missing'
              continue
            fi
            wc -c "$payload"
            sha256sum "$payload"
            stem=$(basename "$payload" .b64)
            decoded="/tmp/$stem"
            patch="/tmp/${stem%.gz}"
            if ! base64 --decode "$payload" > "$decoded"; then
              echo 'base64 decode failed'
              continue
            fi
            wc -c "$decoded"
            sha256sum "$decoded"
            if ! gzip --test "$decoded"; then
              echo 'gzip validation failed'
              continue
            fi
            gzip --decompress --stdout "$decoded" > "$patch"
            wc -c "$patch"
            sha256sum "$patch"
            git apply --stat "$patch"
            if git apply --check "$patch"; then
              echo 'git apply check passed'
            else
              echo 'git apply check failed'
            fi
          done
