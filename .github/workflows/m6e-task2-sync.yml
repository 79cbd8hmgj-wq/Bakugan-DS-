name: Diagnose Milestone 6E Tasks 2-4 Payload

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/m6e-task2-sync.yml
      - automation/m6e-task2-sync.patch.gz.b64

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'milestone-6e-complete-gate-roster-conversion'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: milestone-6e-complete-gate-roster-conversion
          fetch-depth: 0

      - name: Diagnose preserved payload without applying it
        run: |
          set -euo pipefail
          payload=automation/m6e-task2-sync.patch.gz.b64
          test -f "$payload"
          echo 'Encoded payload:'
          wc -c "$payload"
          sha256sum "$payload"
          base64 --decode "$payload" > /tmp/m6e-tasks2-4.patch.gz
          echo 'Decoded gzip payload:'
          wc -c /tmp/m6e-tasks2-4.patch.gz
          sha256sum /tmp/m6e-tasks2-4.patch.gz
          gzip --test /tmp/m6e-tasks2-4.patch.gz
          gzip --decompress --stdout /tmp/m6e-tasks2-4.patch.gz > /tmp/m6e-tasks2-4.patch
          echo 'Uncompressed patch:'
          wc -c /tmp/m6e-tasks2-4.patch
          sha256sum /tmp/m6e-tasks2-4.patch
          git apply --stat /tmp/m6e-tasks2-4.patch
          git apply --check /tmp/m6e-tasks2-4.patch
          sed -n '1,40p' /tmp/m6e-tasks2-4.patch
