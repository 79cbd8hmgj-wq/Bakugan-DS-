name: Milestone 6E Task 5 cleanup

on:
  push:
    branches:
      - milestone-6e-complete-gate-roster-conversion

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-6e-complete-gate-roster-conversion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply bounded cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/bakugan_ds/gates/roster_analysis.py')
          text = path.read_text()
          text = text.replace(
              'from collections import defaultdict\nfrom dataclasses import dataclass, replace\nfrom pathlib import Path\nfrom typing import Iterable\n',
              'from collections import defaultdict\nfrom collections.abc import Iterable\nfrom dataclasses import dataclass, replace\nfrom pathlib import Path\n',
          )
          path.write_text(text)

          path = Path('src/bakugan_ds/gates/roster_templates.py')
          text = path.read_text()
          text = text.replace(
              '    GATE_RECORD_FIELD_NAMES,\n    FIRST_CARD_ID,\n',
              '    FIRST_CARD_ID,\n    GATE_RECORD_FIELD_NAMES,\n',
          )
          path.write_text(text)

          path = Path('tests/unit/test_gate_roster_metadata.py')
          text = path.read_text()
          text = text.replace(
              '        g_influence_summary="Hybrid flat, compressed-core percentage, Aquos, and owner-behind G bonuses.",\n',
              '        g_influence_summary=(\n'
              '            "Hybrid flat, compressed-core percentage, Aquos, and "\n'
              '            "owner-behind G bonuses."\n'
              '        ),\n',
          )
          text = text.replace(
              '        differentiation_rationale="Frozen Milestone 6D compatibility fixture and reference Comeback Gate.",\n',
              '        differentiation_rationale=(\n'
              '            "Frozen Milestone 6D compatibility fixture and reference "\n'
              '            "Comeback Gate."\n'
              '        ),\n',
          )
          path.write_text(text)

          path = Path('tests/unit/test_gate_roster_templates.py')
          text = path.read_text().replace(
              '    incomplete["templates"] = incomplete["templates"][1:]\n',
              '    incomplete["templates"] = incomplete["templates"][2:]\n',
          )
          path.write_text(text)
          PY
          python -m pip install ruff
          python -m ruff check --fix \
            src/bakugan_ds/gates/roster_analysis.py \
            src/bakugan_ds/gates/roster_templates.py \
            tests/unit/test_gate_roster_metadata.py \
            tests/unit/test_gate_roster_templates.py
          python -m ruff format \
            src/bakugan_ds/gates/roster_analysis.py \
            src/bakugan_ds/gates/roster_templates.py \
            tests/unit/test_gate_roster_metadata.py \
            tests/unit/test_gate_roster_templates.py
          git rm .github/workflows/m6e-task5-cleanup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/bakugan_ds/gates/roster_analysis.py \
            src/bakugan_ds/gates/roster_templates.py \
            tests/unit/test_gate_roster_metadata.py \
            tests/unit/test_gate_roster_templates.py
          git commit -m 'fix: clean up Milestone 6E Task 5 verification'
          git push origin HEAD:milestone-6e-complete-gate-roster-conversion
