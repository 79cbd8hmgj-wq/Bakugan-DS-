name: Milestone 6E Task 5 mypy cleanup

on:
  push:
    branches:
      - milestone-6e-complete-gate-roster-conversion

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-6e-complete-gate-roster-conversion
          fetch-depth: 0
      - name: Fix metadata ID diagnostic variable types
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/bakugan_ds/gates/roster_metadata.py')
          text = path.read_text()
          text = text.replace(
              '        missing = sorted(expected_ids - card_ids)\n'
              '        extra = sorted(card_ids - expected_ids)\n'
              '        raise WorkspaceError(\n'
              '            f"Gate roster metadata ID coverage is invalid: missing={missing}, extra={extra}"\n'
              '        )\n',
              '        missing_ids = sorted(expected_ids - card_ids)\n'
              '        extra_ids = sorted(card_ids - expected_ids)\n'
              '        raise WorkspaceError(\n'
              '            "Gate roster metadata ID coverage is invalid: "\n'
              '            f"missing={missing_ids}, extra={extra_ids}"\n'
              '        )\n',
          )
          path.write_text(text)
          PY
          git rm .github/workflows/m6e-task5-mypy-cleanup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/bakugan_ds/gates/roster_metadata.py
          git commit -m 'fix: disambiguate Gate metadata ID diagnostics'
          git push origin HEAD:milestone-6e-complete-gate-roster-conversion
