name: Milestone 6E Task 6 authoring

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  issues: write

concurrency:
  group: milestone-6e-task6-authoring-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  author:
    if: >-
      github.head_ref == 'milestone-6e-complete-gate-roster-conversion' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Generate and verify reviewed batches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          {
            python .github/scripts/m6e_task6_author.py
            python -m pytest -q \
              tests/unit/test_gate_milestone_6e_power_attribute.py \
              tests/unit/test_gate_roster_templates.py \
              tests/unit/test_gate_roster_metadata.py \
              tests/unit/test_gate_roster_analysis.py
            python -m compileall -q src tests tools
            python -m ruff check src tests tools
            python -m mypy src/bakugan_ds
            python -m pytest -q
            git diff --check
          } > /tmp/task6.log 2>&1
          status=$?
          if [[ $status -ne 0 ]]; then
            {
              echo '### Milestone 6E Task 6 authoring failure'
              echo
              echo '```text'
              tail -c 55000 /tmp/task6.log
              echo '```'
            } > /tmp/task6-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" \
              --body-file /tmp/task6-comment.md
            exit $status
          fi
          cat /tmp/task6.log
      - name: Commit verified Task 6 batch
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/m6e-task6-authoring.yml \
            .github/scripts/m6e_task6_author.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            config/gates/milestone-6e-system2-v1.json \
            config/gates/milestone-6e-roster-metadata.json \
            tests/unit/test_gate_milestone_6e_power_attribute.py
          git commit -m 'feat: author Power and Attribute Gate batches'
          git push origin HEAD:${{ github.head_ref }}
