name: Milestone 6E Task 6 authoring

on:
  push:
    branches:
      - milestone-6e-complete-gate-roster-conversion

permissions:
  contents: write

jobs:
  author:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-6e-complete-gate-roster-conversion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Generate reviewed Power and Attribute batches
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/generate_task6.py <<'PY'
          from __future__ import annotations

          import json
          from collections import Counter
          from dataclasses import asdict, dataclass, replace
          from itertools import product
          from pathlib import Path

          from bakugan_ds.errors import WorkspaceError
          from bakugan_ds.gates.authoring import (
              approved_juggernoid_record,
              load_gate_roster_authoring_document,
          )
          from bakugan_ds.gates.balance import (
              ATTRIBUTE_NAMES,
              BATTLE_TYPE_NAMES,
              GateBalanceReport,
              analyze_gate_balance,
          )
          from bakugan_ds.gates.record import (
              GateArchetype,
              GateRecordV1,
              serialize_record,
          )
          from bakugan_ds.gates.roster_analysis import _evaluate_record
          from bakugan_ds.gates.roster_metadata import (
              DesignTier,
              ReviewStatus,
              load_gate_roster_metadata,
              write_gate_roster_metadata,
          )
          from bakugan_ds.gates.roster_templates import (
              GateRosterTemplate,
              load_gate_roster_templates,
          )
          from bakugan_ds.gates.system2 import FallbackReason, record_fallback_reason

          ROOT = Path('.')
          BASELINE = ROOT / 'config/gates/milestone-6d-system2-v1.json'
          OUTPUT = ROOT / 'config/gates/milestone-6e-system2-v1.json'
          METADATA = ROOT / 'config/gates/milestone-6e-roster-metadata.json'
          TEMPLATES = ROOT / 'config/gates/milestone-6e-archetype-templates.json'
          POWER_IDS = tuple(range(1, 16))
          ATTRIBUTE_IDS = tuple(range(40, 62))

          CONDITION_NAMES = {
              0: 'unconditionally',
              1: 'while the owner side is behind',
              2: 'while the owner side is ahead',
              3: 'while the score is tied',
              4: 'while the owner side has no captures',
              5: 'while the owner side is at match point',
              6: 'while the opposing side is at match point',
              7: 'after a winning Gate landing',
          }
          TARGET_NAMES = {
              0: 'the current combatant',
              1: 'the Gate owner',
              2: 'the non-owner combatant',
          }

          @dataclass(frozen=True)
          class Candidate:
              record: GateRecordV1
              template_id: str
              tier: DesignTier
              balance: GateBalanceReport
              evaluation_signature: tuple[tuple[object, ...], ...]
              runtime_signature: bytes
              minimum: int
              maximum: int

          def rotate_right(values: tuple[int, ...], shift: int) -> tuple[int, ...]:
              shift %= len(values)
              if shift == 0:
                  return values
              return values[-shift:] + values[:-shift]

          def tier_for(values: tuple[int, ...]) -> DesignTier | None:
              if not values:
                  return None
              minimum = min(values)
              maximum = max(values)
              if minimum >= 70 and maximum <= 130:
                  return DesignTier.EARLY_COMMON
              if minimum >= 110 and maximum <= 180:
                  return DesignTier.MID
              if minimum >= 140 and maximum <= 220:
                  return DesignTier.RARE_SPECIALIZED
              if maximum <= 250:
                  return DesignTier.HIGH_RISK_CONDITIONAL
              return None

          def build_candidates(
              templates: tuple[GateRosterTemplate, ...],
              archetype: GateArchetype,
          ) -> tuple[Candidate, ...]:
              output: list[Candidate] = []
              seen_runtime: set[bytes] = set()
              for template in templates:
                  if template.archetype is not archetype:
                      continue
                  prototype = template.prototype
                  for flat_drop, percent_drop, effect_drop in product(
                      (0, 25, 50), (0, 16, 32), (0, 25, 50)
                  ):
                      flat = max(0, prototype.flat_bonus_g - flat_drop)
                      percentage = max(0, prototype.percent_q8_8 - percent_drop)
                      effect_value = max(0, prototype.effect_value - effect_drop)
                      for attribute_shift in range(6):
                          attributes = rotate_right(
                              prototype.attribute_modifiers, attribute_shift
                          )
                          for preferred_type in range(6):
                              battle_shift = (
                                  preferred_type - prototype.preferred_type
                              ) % 6
                              weights = rotate_right(
                                  prototype.battle_weights, battle_shift
                              )
                              record = replace(
                                  prototype,
                                  card_id=1,
                                  flat_bonus_g=flat,
                                  percent_q8_8=percentage,
                                  effect_value=effect_value,
                                  attribute_modifiers=attributes,
                                  battle_weights=weights,
                                  preferred_type=preferred_type,
                              )
                              try:
                                  balance = analyze_gate_balance(record)
                              except WorkspaceError:
                                  continue
                              if record_fallback_reason(record) is not FallbackReason.NONE:
                                  continue
                              evaluation = _evaluate_record(record)
                              values = evaluation.values
                              tier = tier_for(values)
                              if tier is None:
                                  continue
                              runtime = serialize_record(record)
                              if runtime in seen_runtime:
                                  continue
                              seen_runtime.add(runtime)
                              output.append(
                                  Candidate(
                                      record=record,
                                      template_id=template.template_id,
                                      tier=tier,
                                      balance=balance,
                                      evaluation_signature=evaluation.signature(),
                                      runtime_signature=runtime,
                                      minimum=min(values),
                                      maximum=max(values),
                                  )
                              )
              return tuple(
                  sorted(
                      output,
                      key=lambda candidate: (
                          candidate.record.preferred_type,
                          candidate.template_id,
                          candidate.record.condition_id,
                          candidate.record.target_mode,
                          abs(candidate.balance.budget.net_budget - 100),
                          candidate.maximum,
                          candidate.minimum,
                          candidate.runtime_signature,
                      ),
                  )
              )

          def choose_batch(
              candidates: tuple[Candidate, ...],
              card_ids: tuple[int, ...],
              used_runtime: set[bytes],
              used_evaluations: set[tuple[tuple[object, ...], ...]],
          ) -> tuple[tuple[int, Candidate], ...]:
              chosen: list[tuple[int, Candidate]] = []
              template_use: Counter[str] = Counter()
              condition_use: Counter[int] = Counter()
              for index, card_id in enumerate(card_ids):
                  preferred = index % 6
                  eligible = [
                      candidate
                      for candidate in candidates
                      if candidate.record.preferred_type == preferred
                      and candidate.runtime_signature not in used_runtime
                      and candidate.evaluation_signature not in used_evaluations
                  ]
                  if not eligible:
                      raise WorkspaceError(
                          f'no unique candidate remains for Gate {card_id} '
                          f'and battle type {preferred}'
                      )
                  selected = min(
                      eligible,
                      key=lambda candidate: (
                          template_use[candidate.template_id],
                          condition_use[candidate.record.condition_id],
                          abs(candidate.balance.budget.net_budget - 100),
                          candidate.maximum,
                          candidate.minimum,
                          candidate.template_id,
                          candidate.runtime_signature,
                      ),
                  )
                  used_runtime.add(selected.runtime_signature)
                  used_evaluations.add(selected.evaluation_signature)
                  template_use[selected.template_id] += 1
                  condition_use[selected.record.condition_id] += 1
                  chosen.append((card_id, selected))
              return tuple(chosen)

          def metadata_summary(candidate: Candidate) -> tuple[str, str, str, str, str]:
              record = candidate.record
              balance = candidate.balance
              primary_attribute = ATTRIBUTE_NAMES[
                  max(range(6), key=lambda index: record.attribute_modifiers[index])
              ]
              preferred_battle = BATTLE_TYPE_NAMES[record.preferred_type]
              positive_count = balance.attribute.positive_count
              negative_count = balance.attribute.negative_count
              gameplay_identity = (
                  f'{GateArchetype(record.archetype).name.title()} Gate using '
                  f'{candidate.template_id} with {primary_attribute} emphasis.'
              )
              g_summary = (
                  f'{record.flat_bonus_g} flat G, {record.percent_q8_8}/256 '
                  f'compressed-core scaling, {positive_count} positive and '
                  f'{negative_count} opposed attribute relationships.'
              )
              weight_summary = (
                  f'{balance.battle_weights.pressure.value.replace("_", " ").title()} '
                  f'{preferred_battle} preference; every battle type remains reachable.'
              )
              effect_description = (
                  f'{CONDITION_NAMES[record.condition_id]}, applies '
                  f'{record.effect_value} G through effect {record.effect_id} to '
                  f'{TARGET_NAMES[record.target_mode]}.'
              )
              rationale = (
                  f'Unique {candidate.template_id} variation with '
                  f'{primary_attribute} as its highest relationship, '
                  f'{preferred_battle} preference, condition {record.condition_id}, '
                  f'and evaluated swing {candidate.minimum}..{candidate.maximum} G.'
              )
              return (
                  gameplay_identity,
                  g_summary,
                  weight_summary,
                  effect_description,
                  rationale,
              )

          records = list(load_gate_roster_authoring_document(BASELINE))
          metadata = list(load_gate_roster_metadata(METADATA))
          templates = load_gate_roster_templates(TEMPLATES)
          juggernoid = approved_juggernoid_record()
          used_runtime = {serialize_record(replace(juggernoid, card_id=1))}
          used_evaluations = {_evaluate_record(juggernoid).signature()}

          power_candidates = build_candidates(templates, GateArchetype.POWER)
          attribute_candidates = build_candidates(templates, GateArchetype.ATTRIBUTE)
          power_batch = choose_batch(
              power_candidates, POWER_IDS, used_runtime, used_evaluations
          )
          attribute_batch = choose_batch(
              attribute_candidates, ATTRIBUTE_IDS, used_runtime, used_evaluations
          )

          for card_id, candidate in (*power_batch, *attribute_batch):
              record = replace(candidate.record, card_id=card_id)
              records[card_id - 1] = record
              entry = metadata[card_id - 1]
              (
                  gameplay_identity,
                  g_summary,
                  weight_summary,
                  rule_summary,
                  rationale,
              ) = metadata_summary(candidate)
              metadata[card_id - 1] = replace(
                  entry,
                  archetype=GateArchetype(record.archetype),
                  design_tier=candidate.tier,
                  gameplay_identity=gameplay_identity,
                  g_influence_summary=g_summary,
                  battle_weight_summary=weight_summary,
                  rule_summary=rule_summary,
                  net_budget=candidate.balance.budget.net_budget,
                  differentiation_rationale=rationale,
                  review_status=ReviewStatus.REVIEWED,
              )

          if records[18] != juggernoid:
              raise WorkspaceError('Gate 19 changed during Task 6 authoring')

          authoring_payload = {
              'format_version': 1,
              'records': [asdict(record) for record in records],
          }
          OUTPUT.write_text(
              json.dumps(authoring_payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          write_gate_roster_metadata(METADATA, tuple(metadata))

          print(
              json.dumps(
                  {
                      'attribute_candidates': len(attribute_candidates),
                      'attribute_records': len(attribute_batch),
                      'power_candidates': len(power_candidates),
                      'power_records': len(power_batch),
                  },
                  sort_keys=True,
              )
          )
          PY
          python /tmp/generate_task6.py
      - name: Verify exact generated tree
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/unit/test_gate_milestone_6e_power_attribute.py \
            tests/unit/test_gate_roster_templates.py \
            tests/unit/test_gate_roster_metadata.py \
            tests/unit/test_gate_roster_analysis.py
          python -m compileall -q src tests tools
          python -m ruff check src tests tools
          python -m mypy src/bakugan_ds
          python -m pytest -q
          git diff --check
      - name: Commit verified Task 6 batch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/m6e-task6-authoring.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            config/gates/milestone-6e-system2-v1.json \
            config/gates/milestone-6e-roster-metadata.json \
            tests/unit/test_gate_milestone_6e_power_attribute.py
          git commit -m 'feat: author Power and Attribute Gate batches'
          git push origin HEAD:milestone-6e-complete-gate-roster-conversion
