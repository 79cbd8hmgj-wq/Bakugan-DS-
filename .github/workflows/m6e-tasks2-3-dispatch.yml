name: Apply Milestone 6E Tasks 2-3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/m6e-tasks2-3-dispatch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check out implementation branch in worktree
        run: |
          set -euo pipefail
          git fetch origin milestone-6e-complete-gate-roster-conversion
          git worktree add --detach /tmp/m6e origin/milestone-6e-complete-gate-roster-conversion

      - name: Verify and apply exact Tasks 2-3 patch
        working-directory: /tmp/m6e
        run: |
          set -euo pipefail
          payload=automation/m6e-tasks2-3.patch.gz.b64
          printf '%s  %s\n' \
            '8b14727597b59a8a76525ed642fb7542ea39affeab6f4fc7088b99e552917ef9' \
            "$payload" | sha256sum -c -
          base64 --decode "$payload" > /tmp/m6e-tasks2-3.patch.gz
          printf '%s  %s\n' \
            '1d24b188a02c74a82b6a900895529282c6778e7fd60e6826732a1d162e5b1b78' \
            /tmp/m6e-tasks2-3.patch.gz | sha256sum -c -
          gzip --decompress --stdout /tmp/m6e-tasks2-3.patch.gz > /tmp/m6e-tasks2-3.patch
          printf '%s  %s\n' \
            '1f4d648df17e1abc3f6f671a76601245fbce24163bf6b7ae8a51176f34a0044b' \
            /tmp/m6e-tasks2-3.patch | sha256sum -c -
          git apply --check /tmp/m6e-tasks2-3.patch
          git apply /tmp/m6e-tasks2-3.patch

      - name: Verify Tasks 1-3
        working-directory: /tmp/m6e
        run: |
          set -euo pipefail
          export PYTHONPATH=src
          python -m pytest -q \
            tests/test_gate_milestone_6e_entry_contract.py \
            tests/unit/test_gate_roster_metadata.py \
            tests/test_gate_milestone_6e_id_name_map.py \
            tests/unit/test_gate_roster_identity.py
          python -m compileall -q src tests
          git diff --check

      - name: Commit exact source and remove PR recovery files
        working-directory: /tmp/m6e
        run: |
          set -euo pipefail
          rm -f automation/m6e-task2-sync.patch.gz.b64
          rm -f automation/m6e-tasks2-3.patch.gz.b64
          rm -f .github/workflows/m6e-task2-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: confirm Milestone 6E Gate identity catalog'
          git push origin HEAD:milestone-6e-complete-gate-roster-conversion

      - name: Remove one-shot dispatcher from main
        run: |
          set -euo pipefail
          rm -f .github/workflows/m6e-tasks2-3-dispatch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: remove Milestone 6E Tasks 2-3 dispatcher'
          git push origin HEAD:main
