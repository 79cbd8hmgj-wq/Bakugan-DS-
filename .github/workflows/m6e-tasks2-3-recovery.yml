name: Apply Milestone 6E Tasks 2-3 Recovery

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/m6e-tasks2-3-recovery.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out Milestone 6E implementation branch
        uses: actions/checkout@v4
        with:
          ref: milestone-6e-complete-gate-roster-conversion
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project tooling
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Apply preserved Tasks 2-3 patch
        run: |
          set -euo pipefail
          payload=automation/m6e-tasks2-3.patch.gz.b64
          test -f "$payload"
          base64 --decode "$payload" > /tmp/m6e-tasks2-3.patch.gz
          gzip --decompress --stdout /tmp/m6e-tasks2-3.patch.gz > /tmp/m6e-tasks2-3.patch
          git apply --check /tmp/m6e-tasks2-3.patch
          git apply /tmp/m6e-tasks2-3.patch
          rm -f automation/m6e-task2-sync.patch.gz.b64
          rm -f automation/m6e-tasks2-3.patch.gz.b64
          rm -f .github/workflows/m6e-task2-sync.yml

      - name: Verify recovered implementation
        run: |
          set -euo pipefail
          python -m pytest -q
          python -m ruff check src tests
          python -m mypy src
          python -m compileall -q src tests
          git diff --check

      - name: Commit and push verified recovery
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add Milestone 6E roster metadata and Gate inventory'
          git push origin HEAD:milestone-6e-complete-gate-roster-conversion
