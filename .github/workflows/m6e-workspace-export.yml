name: Milestone 6E workspace export

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'milestone-6e-complete-gate-roster-conversion'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Archive workspace
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=/tmp/m6e-workspace.tar.gz HEAD
          sha256sum /tmp/m6e-workspace.tar.gz > /tmp/m6e-workspace.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: milestone-6e-workspace
          path: |
            /tmp/m6e-workspace.tar.gz
            /tmp/m6e-workspace.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
