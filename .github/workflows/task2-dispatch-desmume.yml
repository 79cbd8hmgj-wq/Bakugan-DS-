name: Task 2 DeSmuME Builder Dispatch

on:
  pull_request:
    paths:
      - .github/workflows/task2-dispatch-desmume.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch existing debugger builder
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          gh workflow run build-desmume-debug.yml --ref "$HEAD_REF"
          sleep 8
          run_id="$(
            gh run list \
              --workflow build-desmume-debug.yml \
              --branch "$HEAD_REF" \
              --event workflow_dispatch \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId'
          )"
          test -n "$run_id"
          echo "DESMUME_BUILD_RUN_ID=$run_id"
