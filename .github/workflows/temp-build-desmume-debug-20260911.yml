name: Temporary DeSmuME GDB Bundle

on:
  push:
    branches:
      - automation/desmume-debug-bundle-20260911

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            autoconf automake binutils build-essential ca-certificates file git \
            libasound2-dev libglib2.0-dev libglu1-mesa-dev libgtk2.0-dev \
            libpcap-dev libsdl2-dev libtool libx11-dev libzzip-dev make \
            pax-utils pkg-config xz-utils zlib1g-dev

      - name: Build DeSmuME with ARM9 GDB stub
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/TASEmulators/desmume.git source
          git -C source checkout --detach 84e445159ccf2fd7900748094518eb1e88bdc7d0
          cd source/desmume/src/frontend/posix
          autoreconf -i
          ./configure --prefix=/usr --enable-gdb-stub
          make -j"$(nproc)"
          test -x cli/desmume-cli

      - name: Assemble portable bundle
        shell: bash
        run: |
          set -euo pipefail
          binary="source/desmume/src/frontend/posix/cli/desmume-cli"
          bundle="bundle/desmume-debug"
          mkdir -p "$bundle/lib"
          install -m 0755 "$binary" "$bundle/desmume-cli"

          file "$bundle/desmume-cli" | tee "$bundle/desmume-file.txt"
          grep -Eq 'ELF 64-bit.*x86-64' "$bundle/desmume-file.txt"
          ldd "$bundle/desmume-cli" | tee "$bundle/desmume-ldd.txt"
          ! grep -q 'not found' "$bundle/desmume-ldd.txt"

          mapfile -t libraries < <(ldd "$bundle/desmume-cli" | awk '/=> \/.* \(/ {print $3} /^[[:space:]]*\/.*\(/ {print $1}' | sort -u)
          for library in "${libraries[@]}"; do
            base="$(basename "$library")"
            case "$base" in
              ld-linux-x86-64.so.2|libc.so.6|libm.so.6|libdl.so.2|libpthread.so.0|librt.so.1|libresolv.so.2) continue ;;
            esac
            cp -L "$library" "$bundle/lib/$base"
          done

          cat > "$bundle/run-desmume-debug.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="$ROOT/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export SDL_VIDEODRIVER="${SDL_VIDEODRIVER:-dummy}"
          export SDL_AUDIODRIVER="${SDL_AUDIODRIVER:-dummy}"
          exec "$ROOT/desmume-cli" "$@"
          SH
          chmod 0755 "$bundle/run-desmume-debug.sh"

          set +e
          "$bundle/run-desmume-debug.sh" --help > "$bundle/desmume-help.txt" 2>&1
          status=$?
          set -e
          test -s "$bundle/desmume-help.txt"
          if ! grep -qi 'arm9gdb' "$bundle/desmume-help.txt" && ! strings "$bundle/desmume-cli" | grep -qi 'arm9gdb'; then
            echo 'ARM9 GDB option missing' >&2
            exit 1
          fi
          if [[ "$status" -eq 126 || "$status" -eq 127 ]]; then
            exit 1
          fi

          cat > "$bundle/BUILD_INFO.txt" <<EOF
          DeSmuME commit: 84e445159ccf2fd7900748094518eb1e88bdc7d0
          Runner: ubuntu-24.04 x86_64
          Configure: ./configure --prefix=/usr --enable-gdb-stub
          Workflow commit: $GITHUB_SHA
          EOF

          cat > "$bundle/README.txt" <<'EOF'
          Linux x86_64 DeSmuME build with ARM9 GDB stub enabled.

          Example:
            ./run-desmume-debug.sh --arm9gdb=20000 /path/to/game.nds
          EOF

          cp source/desmume/COPYING "$bundle/license.txt"
          (cd "$bundle" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
          tar -C bundle -cJf bundle/desmume-linux-gdb-x86_64.tar.xz desmume-debug
          sha256sum bundle/desmume-linux-gdb-x86_64.tar.xz

      - uses: actions/upload-artifact@v4
        with:
          name: desmume-linux-gdb-x86_64
          path: bundle/desmume-linux-gdb-x86_64.tar.xz
          retention-days: 1
          if-no-files-found: error
